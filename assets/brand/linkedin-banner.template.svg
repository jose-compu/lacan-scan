<?xml version="1.0" encoding="UTF-8"?>
<!--
  LinkedIn share banner template for Lacan Scan releases.
  Canvas: 1200 x 480 (less wide than LinkedIn cover; good for feed posts).

  Copy this file into assets/brand/linkedin-banners/, replace the
  __PLACEHOLDERS__, render a PNG locally. Do not commit filled banners;
  only this template belongs in the repository.

  Placeholders:
    __VERSION__      e.g. 7.2.1
    __HEADLINE__     one short benefit line
    __BENEFIT_1__    short benefit
    __BENEFIT_2__    short benefit
    __BENEFIT_3__    short benefit
    __ACTION_REF__   e.g. jose-compu/lacan-scan@v7
    __VERSION_PIN__  e.g. "7" or "7.2.1"

  Mark: logo-linkedin.png (oval on exact ivory #f1e0c4, no rectangular halo).
  When copying this file into linkedin-banners/, set the <image> href to
  ../logo-linkedin.png. The PNG mark is applied by the magick step below;
  do not skip that step (librsvg often skips external PNGs).

  Render (from repo root), then composite the mark:
    rsvg-convert -w 1200 -h 480 -o assets/brand/linkedin-banners/vVERSION.png \
      assets/brand/linkedin-banners/vVERSION.svg
    magick assets/brand/linkedin-banners/vVERSION.png \
      \( assets/brand/logo-linkedin.png -resize 180x210 \) \
      -gravity East -geometry +40+0 -compose over -composite \
      assets/brand/linkedin-banners/vVERSION.png

  Colors: ivory #f1e0c4, vert #2e4a3f, or #c9a96a.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="480" viewBox="0 0 1200 480" role="img"
     aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Lacan Scan __VERSION__</title>
  <desc id="banner-desc">__HEADLINE__. GitHub Action __ACTION_REF__.</desc>

  <rect width="1200" height="480" fill="#f1e0c4"/>
  <rect x="16" y="16" width="1168" height="448" fill="none" stroke="#2e4a3f" stroke-width="2"/>
  <rect x="24" y="24" width="1152" height="432" fill="none" stroke="#2e4a3f" stroke-width="0.6"/>
  <line x1="48" y1="86" x2="700" y2="86" stroke="#2e4a3f" stroke-width="0.8"/>
  <line x1="48" y1="92" x2="420" y2="92" stroke="#c9a96a" stroke-width="3"/>

  <image x="970" y="120" width="180" height="210" preserveAspectRatio="xMidYMid meet"
         xlink:href="logo-linkedin.png"/>

  <text x="48" y="72" fill="#2e4a3f"
        font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="1.2">LACAN SCAN __VERSION__</text>

  <text x="48" y="140" fill="#24382f"
        font-family="Georgia, 'Times New Roman', serif" font-size="22">__HEADLINE__</text>

  <text x="48" y="190" fill="#2e4a3f"
        font-family="Georgia, 'Times New Roman', serif" font-size="16">-  __BENEFIT_1__</text>
  <text x="48" y="224" fill="#2e4a3f"
        font-family="Georgia, 'Times New Roman', serif" font-size="16">-  __BENEFIT_2__</text>
  <text x="48" y="258" fill="#2e4a3f"
        font-family="Georgia, 'Times New Roman', serif" font-size="16">-  __BENEFIT_3__</text>

  <text x="48" y="320" fill="#2e4a3f"
        font-family="Georgia, 'Times New Roman', serif" font-size="14" letter-spacing="0.8">GITHUB ACTION</text>
  <text x="48" y="352" fill="#24382f"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">__ACTION_REF__</text>
  <text x="48" y="388" fill="#5c6e64"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">- uses: __ACTION_REF__</text>
  <text x="48" y="416" fill="#5c6e64"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">  with: version: __VERSION_PIN__  fail-on: HIGH  output: sarif</text>
</svg>
