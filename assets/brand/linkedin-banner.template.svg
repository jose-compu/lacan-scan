<?xml version="1.0" encoding="UTF-8"?>
<!--
  LinkedIn share banner template for Lacan Scan releases.
  Canvas: 1584 x 396 (LinkedIn cover; still readable as a feed thumbnail).

  Copy this file into assets/brand/linkedin-banners/, replace the
  __PLACEHOLDERS__, render a PNG locally. Do not commit filled banners;
  only this template belongs in the repository.

  Placeholders:
    __VERSION__      e.g. 7.2.2
    __HEADLINE__     one short benefit line (wrap with a newline if longer than ~52 chars)
    __BENEFIT_1__    short benefit
    __BENEFIT_2__    short benefit
    __BENEFIT_3__    short benefit
    __ACTION_REF__   e.g. jose-compu/lacan-scan@v7
    __VERSION_PIN__  e.g. "7" or "7.2.2"

  Max recommended lengths (single line, no newline) at current font sizes:
    __VERSION__      10 chars (e.g. v7.2.2)
    __HEADLINE__     52 chars (or use one embedded newline for up to ~100)
    __BENEFIT_*__    58 chars each
    __ACTION_REF__   32 chars
    __VERSION_PIN__  12 chars

  Mark: logo-linkedin.png (oval on exact ivory #f1e0c4, no rectangular halo).
  When copying this file into linkedin-banners/, set the <image> href to
  ../logo-linkedin.png. The PNG mark is applied by the magick step below;
  do not skip that step (librsvg often skips external PNGs).

  Render (from repo root), then composite the mark:
    rsvg-convert -w 1584 -h 396 -o assets/brand/linkedin-banners/vVERSION.png \
      assets/brand/linkedin-banners/vVERSION.svg
    magick assets/brand/linkedin-banners/vVERSION.png \
      \( assets/brand/logo-linkedin.png -resize 180x210 \) \
      -gravity East -geometry +48+0 -compose over -composite \
      assets/brand/linkedin-banners/vVERSION.png

  Colors: ivory #f1e0c4, vert #2e4a3f, or #c9a96a.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1584" height="396" viewBox="0 0 1584 396" role="img"
     aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Lacan Scan __VERSION__</title>
  <desc id="banner-desc">__HEADLINE__. GitHub Action __ACTION_REF__.</desc>

  <rect width="1584" height="396" fill="#f1e0c4"/>
  <rect x="16" y="16" width="1552" height="364" fill="none" stroke="#2e4a3f" stroke-width="2"/>
  <rect x="24" y="24" width="1536" height="348" fill="none" stroke="#2e4a3f" stroke-width="0.6"/>
  <line x1="48" y1="76" x2="920" y2="76" stroke="#2e4a3f" stroke-width="0.8"/>
  <line x1="48" y1="83" x2="500" y2="83" stroke="#c9a96a" stroke-width="3"/>

  <!-- href kept for Inkscape preview; composite logo-linkedin.png when rendering PNG -->
  <image x="1356" y="93" width="180" height="210" preserveAspectRatio="xMidYMid meet"
         xlink:href="logo-linkedin.png"/>

  <text x="48" y="64" fill="#2e4a3f"
        font-family="Georgia, 'DejaVu Serif', 'Noto Serif', 'Times New Roman', serif"
        font-size="36" letter-spacing="1.1">LACAN SCAN __VERSION__</text>

  <text x="48" y="118" fill="#24382f" xml:space="preserve"
        font-family="Georgia, 'DejaVu Serif', 'Noto Serif', 'Times New Roman', serif"
        font-size="30">__HEADLINE__</text>

  <text x="48" y="168" fill="#2e4a3f"
        font-family="Georgia, 'DejaVu Serif', 'Noto Serif', 'Times New Roman', serif"
        font-size="22">-  __BENEFIT_1__</text>
  <text x="48" y="202" fill="#2e4a3f"
        font-family="Georgia, 'DejaVu Serif', 'Noto Serif', 'Times New Roman', serif"
        font-size="22">-  __BENEFIT_2__</text>
  <text x="48" y="236" fill="#2e4a3f"
        font-family="Georgia, 'DejaVu Serif', 'Noto Serif', 'Times New Roman', serif"
        font-size="22">-  __BENEFIT_3__</text>

  <text x="48" y="288" fill="#2e4a3f"
        font-family="Georgia, 'DejaVu Serif', 'Noto Serif', 'Times New Roman', serif"
        font-size="18" letter-spacing="0.8">GITHUB ACTION</text>
  <text x="48" y="318" fill="#24382f"
        font-family="ui-monospace, 'DejaVu Sans Mono', 'Liberation Mono', Consolas, monospace"
        font-size="21">__ACTION_REF__</text>
  <text x="48" y="348" fill="#5c6e64"
        font-family="ui-monospace, 'DejaVu Sans Mono', 'Liberation Mono', Consolas, monospace"
        font-size="16">- uses: __ACTION_REF__</text>
  <text x="48" y="372" fill="#5c6e64"
        font-family="ui-monospace, 'DejaVu Sans Mono', 'Liberation Mono', Consolas, monospace"
        font-size="16">  with: version: __VERSION_PIN__  fail-on: HIGH  output: sarif</text>
</svg>