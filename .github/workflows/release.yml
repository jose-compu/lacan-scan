name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      # Crisp 1.11 needs rustc >= 1.88 (let-chains in crisp-parser).
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - name: Install Crisp
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: |
          set -euo pipefail
          rustc --version
          cargo install crisp-lang --locked --version 1.11.0
      - name: Install aarch64 Linux linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Emit + release build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          set -euo pipefail
          crisp emit .
          cargo build --release --manifest-path target/rust/Cargo.toml --target ${{ matrix.target }}
          bin="target/rust/target/${{ matrix.target }}/release/lacan"
          test -x "$bin"
          host="$(rustc -vV | sed -n 's/^host: //p')"
          if [ "${{ matrix.target }}" = "$host" ]; then
            "$bin" --version
          else
            echo "cross-built for ${{ matrix.target }} on $host; skipping execute"
            file "$bin"
            case "${{ matrix.target }}" in
              aarch64-unknown-linux-gnu)
                file "$bin" | grep -qE 'ARM aarch64|aarch64'
                ;;
              *)
                echo "unexpected cross target: ${{ matrix.target }}" >&2
                exit 1
                ;;
            esac
          fi
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          archive="lacan-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C "target/rust/target/${{ matrix.target }}/release" lacan
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "=== ${archive} ==="
          cat "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            lacan-${{ matrix.target }}.tar.gz
            lacan-${{ matrix.target }}.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Show release assets
        run: ls -la dist && cat dist/*.sha256
      - uses: softprops/action-gh-release@v2
        with:
          name: Lacan Scan ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          body: |
            AI-safety static scanner for Git repositories.

            ## GitHub Action
            ```yaml
            - uses: jose-compu/lacan-scan@v3
              with:
                path: .
                fail-on: HIGH
                output: sarif
                sarif-file: lacan.sarif
                version: "3"
                changed-only: "true"
                changed-base: "<pull_request.base.sha>"
            ```

            Floating major tag `v3` tracks the current release line (`v1` / `v2` remain for earlier rule sets). Pin `version: "3.0.5"` for a fixed binary.
      # Keep floating major tags (v1, v2, …) for `uses: jose-compu/lacan-scan@v1`.
      - name: Update major version tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "skip major tag update for non-semver tag: $tag"
            exit 0
          fi
          major="v${BASH_REMATCH[1]}"
          commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          git tag -f "$major" "$commit"
          git push -f origin "refs/tags/${major}"
          echo "pointed ${major} -> ${tag} (${commit})"
